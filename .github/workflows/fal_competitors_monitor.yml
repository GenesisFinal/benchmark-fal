name: Auditoría Diaria Automatizada del Mercado FAL

on:
  schedule:
    # 1. Turno Mañana: 09:00 ART (12:00 UTC)
    - cron: '0 12 * * *'
    # 2. Turno Tarde/Noche: 21:00 ART (00:00 UTC del día siguiente)
    - cron: '0 0 * * *'
    # 3. Ronda de Catch-Up / Reintentos de Sitios Caídos: 15:00 ART (18:00 UTC)
    - cron: '0 18 * * *'
    # 4. Ronda de Catch-Up Nocturna: 03:00 ART (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor-and-update:
    runs-on: ubuntu-latest
    env:
      TZ: 'America/Argentina/Buenos_Aires'
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Auditoría y Monitoreo de Competidores
        run: |
          python scripts/monitor_competitors.py

      - name: Compilar y Sincronizar Sitio Web
        run: |
          python scripts/build_site.py

      - name: Commit y Publicación Automática en GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html benchmark_fal.html
          if git diff --staged --quiet; then
            echo "Sin cambios detectados en las ofertas de los competidores. Datos actualizados."
          else
            git commit -m "Auto-update: Auditoría de mercado FAL $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git push origin main
          fi
